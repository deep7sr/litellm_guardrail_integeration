services:
  litellm:
    # Image must have RAGAS + asyncpg baked in (LiteLLM's official image
    # does not ship them). See README "Runtime image" for how the
    # production image was built.
    image: litellm-hhem:latest
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      - ./guardrail/faithfulness_guardrail.py:/app/faithfulness_guardrail.py
      - ./guardrail/faithfulness_guardrail_reasoning.py:/app/faithfulness_guardrail_reasoning.py
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - DATABASE_URL=postgresql://llmproxy:dbpassword9090@db:5432/litellm
      # RAGAS imports GitPython internally (experiment tracking we don't
      # use); without a git binary in the image, `import ragas` fails unless
      # this check is silenced.
      - GIT_PYTHON_REFRESH=quiet
      # Guardrail settings (central config — no per-request overrides)
      - PROXY_BASE_URL=http://localhost:4000/v1
      - JUDGE_MODEL=judge-model
      - GUARDRAIL_THRESHOLD=0.7
      - MAX_ATTEMPTS=3
      - GUARDRAIL_MODE=retry   # "retry" (regenerate) or "block" (fail fast)
      - JUDGE_TIMEOUT_SECONDS=60
      # - EVIDENCE_MARKER=--- Retrieved Evidence ---   # default; override only org-wide
    depends_on:
      - db
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: faithfulness-dashboard
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://llmproxy:dbpassword9090@db:5432/litellm
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - litellm_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  litellm_pg_data:
